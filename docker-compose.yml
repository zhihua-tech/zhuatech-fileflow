services:
  mysql:
    image: mysql:8.4
    environment: {MYSQL_DATABASE: zhuatech_fileflow, MYSQL_USER: zhuatech, MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}", MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}"}
    ports: ["3310:3306"]
    volumes: ["fileflow_mysql:/var/lib/mysql", "./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro"]
volumes: {fileflow_mysql: {}}
