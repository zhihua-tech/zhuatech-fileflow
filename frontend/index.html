<!doctype html><!-- Copyright 2026 上海如静知华信息科技有限公司 --><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知华 FileFlow</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#222d3b;font:14px "PingFang SC",sans-serif}header{height:64px;background:#fff;border-bottom:1px solid #dde2ea;padding:0 5vw;display:flex;align-items:center;gap:18px}header b{color:#6d4bd1}header a{margin-left:auto;color:#6d4bd1}main{max-width:1080px;margin:30px auto;padding:0 18px}.card{background:#fff;border:1px solid #dde2ea;border-radius:10px;padding:22px}.drop{border:2px dashed #cbc3e9;border-radius:9px;padding:45px;text-align:center;background:#faf9fe}select,button{padding:10px 18px;border-radius:6px}button{border:0;background:#6d4bd1;color:#fff;margin-left:8px}.files{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.files div{padding:16px;background:#f7f6fb;border-radius:7px}pre{white-space:pre-wrap}@media(max-width:680px){.files{grid-template-columns:1fr}}</style><header><b>ZhuaTech FileFlow</b><span>批处理规划</span><a href="https://www.zhuatech.cn/">知华科技</a></header><main><div class="card"><div class="drop">本演示仅分析文件元数据，不上传真实文件</div><p><select id="op"><option>CONVERT_PDF</option><option>ARCHIVE</option><option>RENAME</option></select><button id="run">生成处理计划</button></p><div class="files"><div>方案.docx · 60 MB</div><div>预览.png · 50 MB</div><div id="summary">等待规划</div></div><pre id="out"></pre></div></main><script>run.onclick=async()=>{try{const r=await fetch('/api/fileflow/plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({operation:op.value,files:[{name:'方案.docx',extension:'docx',sizeMb:60},{name:'预览.png',extension:'png',sizeMb:50}],maxBatchMb:100,throughputMbPerMinute:20})}).then(x=>x.json());summary.textContent=r.batchCount+' 批 · '+r.estimatedMinutes+' 分钟';out.textContent=r.status+'\n不支持：'+(r.unsupportedFiles.join(', ')||'无')}catch(e){out.textContent='请启动后端服务'}};</scrip
